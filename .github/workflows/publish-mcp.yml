name: Publish curated MCP directory
on:
  push:
    branches: [main]
    paths: ['mcp/curated.json', '.github/workflows/publish-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mcp-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reviewed directory
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("mcp/curated.json", "utf8"))'
          mkdir -p public/mcp
          cp mcp/curated.json public/mcp/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
